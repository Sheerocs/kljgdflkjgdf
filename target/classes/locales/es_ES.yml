    invalid-unit: "#d11d41PermaPiola &8&l>> #c41a36Unidad de tiempo inválida. Usa 's', 'm' o 'h'."
    time-added: "#d11d41PermaPiola &8&l>> #93c47dSe añadieron %time% al Death Hurricane."
    time-removed: "#d11d41PermaPiola &8&l>> #c41a36Se removieron %time% del Death Hurricane."
