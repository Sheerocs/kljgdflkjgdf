  bossbar:
    title: "&8☠ &8[&c%time%&8] &7de #ab1a07Death Hurricane &8☠"

  commands:
    usage: "#d11d41PermaPiola &8&l>> #c41a36Uso: /hurricane <enable|disable|edit>"
