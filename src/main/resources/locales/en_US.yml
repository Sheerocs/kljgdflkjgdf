# ============================================================= #
#                        DEATH HURRICANE                        #
# ============================================================= #
hurricane:
  death-event:
    broadcast-message: "#ba0000The soul of #cc0425&l%victim% #ba0000has been dragged into the #ab1a07Infinity Limbo #ba0000by an unknown entity where they will have no other fate but eternal suffering. #cc0425&lHE'S BEEN PERMABANNED!"
    broadcast-hover: "&c&l☠ Death Details ☠\n&8&l-> &7Cause: &f%cause%\n&8&l-> &7World: &f%world%\n&8&l-> &7Coordinates: &fx:%x% y:%y% z:%z%\n&8&l-> &7Ping: &f%ping%ms\n&8&l-> &7TPS: &f%tps%\n\n&fClick to send coordinates!"

    title: "#990000&k: #d11d41Permadeath! #990000&k:"
    subtitle: "&f%victim% has died"
    spectator-title: "&7&o..."
    spectator-subtitle: "&b&oNow you are a soul"
    kick-reason: "&8&oYour soul has faded away..."
    hurricane-start: "#d11d41PermaPiola &8&l>> #c41a36The #ab1a07Death Hurricane #c41a36starts with a duration of 1 hour!"
    hurricane-end: "#d11d41PermaPiola &8&l>> #93c47dThe #ab1a07Death Hurricane #93c47dhas ended!"
    hurricane-added: "#d11d41PermaPiola &8&l>> #c41a36¡%time% hour(s) have been added to the #ab1a07Death Hurricane#c41a36!"
    staff-chat-death: "&4[StaffChat] &f%cause%"

  bossbar:
    title: "&8☠ &8[&c%time%&8] &7of #ab1a07Death Hurricane &8☠"

  commands:
    usage: "#d11d41PermaPiola &8&l>> #c41a36Usage: /hurricane <enable|disable|edit>"
    usage-edit: "#d11d41PermaPiola &8&l>> #c41a36Usage: /hurricane edit <add|remove|set> <1h2m3s>"
    invalid-time-format: "#d11d41PermaPiola &8&l>> #c41a36Invalid time format. Use for example: 1h30m, 45m, or 1h2m3s."
    cannot-remove-all: "#d11d41PermaPiola &8&l>> #c41a36You cannot remove that much time. The Hurricane must have at least 1 second remaining."
    enabled: "#d11d41PermaPiola &8&l>> #93c47dThe Death Hurricane has been manually activated!"
    already-enabled: "#d11d41PermaPiola &8&l>> #c41a36The Death Hurricane is already active."
    disabled: "#d11d41PermaPiola &8&l>> #c41a36The Death Hurricane has been deactivated!"
    already-disabled: "#d11d41PermaPiola &8&l>> #c41a36The Death Hurricane is not active at this time."
    invalid-number: "#d11d41PermaPiola &8&l>> #c41a36The amount must be a valid integer."
    invalid-unit: "#d11d41PermaPiola &8&l>> #c41a36Invalid time unit. Use 's', 'm' or 'h'."
    time-added: "#d11d41PermaPiola &8&l>> #93c47d%time% were added to the Death Hurricane."
    time-removed: "#d11d41PermaPiola &8&l>> #c41a36%time% were removed from the Death Hurricane."
    time-set: "#d11d41PermaPiola &8&l>> #ffd966The Death Hurricane time was set to %time%."
    broadcast-added: "#d11d41PermaPiola &8&l>> #93c47d%player% added %time% to the Death Hurricane."
    broadcast-removed: "#d11d41PermaPiola &8&l>> #c41a36%player% removed %time% from the Death Hurricane."
    broadcast-set: "#d11d41PermaPiola &8&l>> #ffd966%player% set the Death Hurricane time to %time%."
    debug-active: "#d11d41PermaPiola &8&l>> #93c47dDebug: The Hurricane is ACTIVE."
    debug-inactive: "#d11d41PermaPiola &8&l>> #c41a36Debug: The Hurricane is DEACTIVATED."

