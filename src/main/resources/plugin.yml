name: PermaPiola
description: $description
version: '${version}'

main: pp.sheero.permapiola.PermaPiola
api-version: '1.21.11'
load: STARTUP
softdepend: [DiscordSRV, ProtocolLib]

authors: [ Sheero ]

permissions:
  permapiola.admin:
    description: Permiso base general y mensajes de entrada/salida de administradores.
  permapiola.admin.broadcast:
    description: Permite ejecutar el comando broadcast.
  permapiola.admin.enderchest:
    description: Permite abrir el enderchest de otros jugadores.
  permapiola.admin.playerip:
    description: Permite ver la IP de un jugador.
  permapiola.admin.reload:
    description: Permite recargar las configuraciones del plugin.
  permapiola.admin.staffchat:
    description: Permite hablar y leer el chat del Staff.
  permapiola.admin.spectatorchat:
    description: Permite hablar y leer el chat de Espectadores.
  permapiola.admin.spectator:
    description: Permite seleccionar el canal de espectadores en el comando /chat.
  permapiola.admin.gamemode:
    description: Permite cambiar de modo de juego.
  permapiola.admin.gamemode.adventure:
    description: Permite usar el comando /gma.
  permapiola.admin.gamemode.creative:
    description: Permite usar el comando /gmc.
  permapiola.admin.gamemode.spectator:
    description: Permite usar el comando /gmsp.
  permapiola.admin.gamemode.survival:
    description: Permite usar el comando /gms.
  permapiola.admin.mining:
    description: Recibe notificaciones cuando alguien mina bloques valiosos.
  permapiola.admin.helpop:
    description: Recibe los mensajes de ayuda de los jugadores.
  permapiola.admin.combatlog:
    description: Recibe notificaciones cuando alguien abandona en combate.
  permapiola.admin.revive:
    description: Permite revivir a un jugador muerto.

  permapiola.admin.inventory:
    description: Permiso base para comandos de inventario.
  permapiola.admin.inventory.see:
    description: Permite abrir y editar el inventario en vivo de otros.
  permapiola.admin.inventory.death:
    description: Permite inspeccionar y auditar las tumbas de los caídos.

  permapiola.admin.team:
    description: Permiso base para administrar equipos.
  permapiola.admin.team.system:
    description: Activar o desactivar el sistema de equipos.
  permapiola.admin.team.reset:
    description: Borrar todos los equipos del servidor.
  permapiola.admin.team.fire:
    description: Activar o desactivar el fuego amigo global.
  permapiola.admin.team.size:
    description: Cambiar el límite de miembros por equipo.
  permapiola.admin.team.forcejoin:
    description: Unir a un jugador a un equipo a la fuerza.
  permapiola.admin.team.forceleave:
    description: Expulsar a un jugador de su equipo a la fuerza.
  permapiola.admin.team.list:
    description: Ver la lista de todos los equipos creados.
  permapiola.admin.team.spy:
    description: Leer los chats privados de los equipos.

  permapiola.admin.totem:
    description: Permiso base para administrar los tótems de los jugadores.
  permapiola.admin.totem.add:
    description: Añadir tótems usados a un jugador.
  permapiola.admin.totem.remove:
    description: Restar tótems usados a un jugador.
  permapiola.admin.totem.set:
    description: Establecer una cantidad exacta de tótems a un jugador.
  permapiola.admin.totem.reset:
    description: Reiniciar el contador de tótems a cero.

  permapiola.admin.playtime:
    description: Permiso base para administrar el tiempo de juego.
  permapiola.admin.playtime.add:
    description: Añadir tiempo a un jugador.
  permapiola.admin.playtime.remove:
    description: Restar tiempo a un jugador.
  permapiola.admin.playtime.set:
    description: Establecer un tiempo exacto a un jugador.
  permapiola.admin.playtime.reset:
    description: Reiniciar el tiempo de juego a cero.

  permapiola.admin.hurricane:
    description: Administrar completamente el evento Death Hurricane.
  permapiola.admin.dementialwheel:
    description: Administrar y forzar los eventos de la Ruleta Demencial.

  permapiola.staff:
    description: Permiso base general para el equipo de Staff (bypasses).
  permapiola.donor:
    description: Permiso base para funciones estéticas de Donadores.
  permapiola.donor.rename:
    description: Permite renombrar objetos con colores.
  permapiola.donor.color:
    description: Permite usar colores en el chat público y privado.
  permapiola.donor.emotes:
    description: Permite usar emotes en el chat y abrirlos en el menú.
  permapiola.donor.totem:
    description: Permite elegir sonidos especiales (premium) de muerte de tótem.